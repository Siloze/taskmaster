logfile = /tmp/taskmaster.log

[program stubborn]
cmd = /bin/sh -c "trap '' TERM; while :; do sleep 1; done"
numprocs = 2
starttime = 3
stopsignal = TERM
stoptime = 3

[program expected]
cmd = /bin/sh -c "sleep 4; exit 2"
starttime = 1
exitcodes = 0, 2
autorestart = unexpected

[program unexpected]
cmd = /bin/sh -c "sleep 4; exit 3"
starttime = 1
exitcodes = 0, 2
autorestart = unexpected

[program always]
cmd = /bin/sh -c "sleep 4; exit 0"
starttime = 1
autorestart = always

[program never]
cmd = /bin/sh -c "sleep 200"
starttime = 1
autorestart = never

[program broken]
cmd = /bin/sh -c "exit 1"
starttime = 2
startretries = 3

[program envdemo]
cmd = /bin/sh -c "echo ANSWER=$ANSWER; pwd; umask; echo erreur >&2; sleep 1000"
env.ANSWER = 42
env.STARTED_BY = taskmaster
workingdir = /usr
umask = 077
stdout = /tmp/envdemo.out
stderr = /tmp/envdemo.err

[program spam]
cmd = /usr/bin/yes
stdout = discard
stderr = discard

[program manual]
cmd = /bin/sleep 100
autostart = false