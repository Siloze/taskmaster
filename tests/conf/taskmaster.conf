logfile = /tmp/taskmaster_process_supervisor_test.log

[program sleeper]
cmd = /bin/sleep 10
numprocs = 1
autostart = true
autorestart = unexpected
exitcodes = 0, 2
starttime = 0
startretries = 3
stopsignal = TERM
stoptime = 1
stdout = discard
stderr = discard
env.TASKMASTER_TEST_VERSION = 1
workingdir = /tmp
umask = 022
